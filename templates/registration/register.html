{% extends "layout.html" %}

{% block title %}
  Register - Django Web
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm w-50 mx-auto p-4">
        <h2 class="text-center mb-4">Create an Account</h2>
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label font-weight-bold">Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label font-weight-bold">Email</label>
                {{ form.email }}
            </div>

            <div class="mb-3">
                <label class="form-label font-weight-bold">Password</label>
                {{ form.password1 }}
            </div>

            <div class="mb-3">
                <label class="form-label font-weight-bold">Confirm Password</label>
                {{ form.password2 }}
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="togglePassword" onclick="togglePasswordVisibility()">
                <label class="form-check-label" for="togglePassword">Show Passwords</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const pass1 = document.getElementById("id_password1");
        const pass2 = document.getElementById("id_password2");
        if (pass1) pass1.type = pass1.type === "password" ? "text" : "password";
        if (pass2) pass2.type = pass2.type === "password" ? "text" : "password";
    }
</script>
{% endblock %}
