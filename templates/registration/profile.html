{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 text-center">
      <img src="{{ user.profile.image.url }}" class="rounded-circle mb-3 border" width="120" height="120" style="object-fit: cover;">
      <h3>{{ user.username }}</h3>
      <p class="text-muted">{{ user.email }}</p>

      <hr>

      <form method="post" enctype="multipart/form-data" class="text-start">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label"><strong>Username</strong></label>
          {{ u_form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label"><strong>Email</strong></label>
          {{ u_form.email }}
        </div>
        <div class="mb-3">
          <label class="form-label"><strong>Profile Picture</strong></label>
          {{ p_form.image }}
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Update Profile</button>
      </form>

      <hr class="my-4">

      <div class="text-start">
        <h5 class="text-danger">Danger Zone</h5>
        <a href="{% url 'delete_account' %}" class="btn btn-outline-danger btn-sm">Delete Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
