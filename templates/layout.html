<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <title>
        {% block title %}
            Your web
        {% endblock %}
    </title>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">

    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'tweet_list' %}">Tweetbar</a>

        <button class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav mr-auto">

                <li class="nav-item active">
                    <a class="nav-link" href="{% url 'tweet_list' %}">
                        Home <span class="sr-only">(current)</span>
                    </a>
                </li>

            </ul>

            <form class="form-inline my-2 my-lg-0 mr-auto" role="search" method="get" action="{% url 'tweet_list' %}">
                <input class="form-control mr-sm-2"
                       type="search"
                       name="search"
                       placeholder="Search tweets or users..."
                       aria-label="Search"
                       value="{{ request.GET.search|default:'' }}">
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
                    Search
                </button>
            </form>

            <a href="{% url 'tweet_list' %}"
               class="btn btn-primary mx-2">
                Tweet Home
            </a>

            {% if user.is_authenticated %}

                <form method="post" action="{% url 'logout' %}" class="form-inline m-0">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'register' %}"
                   class="btn btn-primary mx-2">
                    Register
                </a>

                <a href="{% url 'login' %}"
                   class="btn btn-success mx-2">
                    Login
                </a>

            {% endif %}

        </div>
    </div>
</nav>


<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRQSqqxLKlFuL+Wj8ER/2v3D6b7gA" crossorigin="anonymous"></script>

</body>
</html>
